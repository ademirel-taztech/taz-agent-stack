name = "taa_brain"
description = "Use this agent for TAA Brain operations - recalling institutional memory before pipeline stages (patterns, past ADRs, recurring security findings, lessons learned) and consolidating a finished pipeline run back into the brain (dream cycle). MUST BE USED at pipeline start (recall) and after completion (/taa:dream). Returns cited, synthesized answers - never raw file dumps."
